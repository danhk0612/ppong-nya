name: ppong-nya

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-ppong_nya}
      MARIADB_USER: ${MARIADB_USER:-ppong_nya}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_AUTO_UPGRADE: "1"
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - ${MARIADB_DATA_DIR:-./data/mariadb}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  migrate:
    image: ghcr.io/danhk0612/ppong-nya:${IMAGE_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MARIADB_USER:-ppong_nya}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE:-ppong_nya}?connection_limit=5&pool_timeout=10&connect_timeout=10
      TZ: ${TZ:-Asia/Seoul}
    command: ["npm", "run", "db:migrate:deploy"]
    restart: "no"

  app:
    image: ghcr.io/danhk0612/ppong-nya:${IMAGE_TAG:-latest}
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?set PUBLIC_SITE_URL in .env}
      PUBLIC_SITE_NAME: ${PUBLIC_SITE_NAME:-퐁냐}
      ORIGIN: ${PUBLIC_SITE_URL:?set PUBLIC_SITE_URL in .env}
      DATABASE_URL: mysql://${MARIADB_USER:-ppong_nya}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE:-ppong_nya}?connection_limit=10&pool_timeout=10&connect_timeout=10
      PLAYER_CACHE_RETENTION_DAYS: ${PLAYER_CACHE_RETENTION_DAYS:-90}
      PLAYER_CACHE_MAX_RECORDS: ${PLAYER_CACHE_MAX_RECORDS:-2000}
      TZ: ${TZ:-Asia/Seoul}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    init: true
    restart: unless-stopped

  collector:
    profiles: ["collector"]
    image: ghcr.io/danhk0612/ppong-nya-collector:${IMAGE_TAG:-latest}
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: mysql://${MARIADB_USER:-ppong_nya}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE:-ppong_nya}
      MAJSOUL_UID: ${MAJSOUL_UID:-}
      MAJSOUL_TOKEN: ${MAJSOUL_TOKEN:-}
      MAJSOUL_DEVICE_ID: ${MAJSOUL_DEVICE_ID:-}
      MAJSOUL_ACCESS_TOKEN: ${MAJSOUL_ACCESS_TOKEN:-}
      MAJSOUL_OAUTH_TYPE: ${MAJSOUL_OAUTH_TYPE:-22}
      MAJSOUL_URL_BASE: ${MAJSOUL_URL_BASE:-https://mahjongsoul.game.yo-star.com/}
      MAJSOUL_LOGIN_REGION: ${MAJSOUL_LOGIN_REGION:-en}
      MAJSOUL_YOSTAR_REGION: ${MAJSOUL_YOSTAR_REGION:-en}
      MAJSOUL_YOSTAR_SDK_URL: ${MAJSOUL_YOSTAR_SDK_URL:-}
      MAJSOUL_ROUTE_ID: ${MAJSOUL_ROUTE_ID:-}
      MAJSOUL_LOBBY_ENDPOINT: ${MAJSOUL_LOBBY_ENDPOINT:-}
      MAJSOUL_RESOURCE_VERSION: ${MAJSOUL_RESOURCE_VERSION:-}
      MAJSOUL_PRODUCT_VERSION: ${MAJSOUL_PRODUCT_VERSION:-}
      COLLECTOR_POLL_INTERVAL_MS: ${COLLECTOR_POLL_INTERVAL_MS:-7000}
      COLLECTOR_RECORD_DELAY_MS: ${COLLECTOR_RECORD_DELAY_MS:-1200000}
      COLLECTOR_RECORD_BATCH_SIZE: ${COLLECTOR_RECORD_BATCH_SIZE:-20}
      COLLECTOR_LIST_ONLY: ${COLLECTOR_LIST_ONLY:-false}
      TZ: ${TZ:-Asia/Seoul}
    init: true
    restart: unless-stopped
