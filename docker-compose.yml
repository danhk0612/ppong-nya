services:
  app:
    build:
      context: .
      target: runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_SITE_URL: http://localhost:3000
      ORIGIN: http://localhost:3000
      DATABASE_URL: ${DATABASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-replace-me}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-replace-me}
      AUTH_SECRET: ${AUTH_SECRET:-replace-me-with-a-long-random-string}
    ports:
      - "3000:3000"
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: build
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["npm", "run", "db:migrate:deploy"]
    restart: "no"
