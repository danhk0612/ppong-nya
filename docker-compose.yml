services:
  app:
    build:
      context: .
      target: runtime
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_SITE_URL: http://localhost:3000
      ORIGIN: http://localhost:3000
      DATABASE_URL: mysql://ppong_nya:ppong_nya_password@db:3306/ppong_nya
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-replace-me}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-replace-me}
      AUTH_SECRET: ${AUTH_SECRET:-replace-me-with-a-long-random-string}
    ports:
      - "3000:3000"
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: build
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://ppong_nya:ppong_nya_password@db:3306/ppong_nya
    command: ["npm", "run", "db:migrate:deploy"]
    restart: "no"

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ppong_nya
      MARIADB_USER: ppong_nya
      MARIADB_PASSWORD: ppong_nya_password
      MARIADB_ROOT_PASSWORD: root_password
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "3306:3306"
    restart: unless-stopped

volumes:
  mariadb-data:
