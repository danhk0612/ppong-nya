services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ppong_nya
      MARIADB_USER: ppong_nya
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-local-development-password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-local-root-password}
      MARIADB_AUTO_UPGRADE: "1"
      TZ: Asia/Seoul
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://ppong_nya:${MARIADB_PASSWORD:-local-development-password}@db:3306/ppong_nya?connection_limit=5&pool_timeout=10&connect_timeout=10
    command: ["npm", "run", "db:migrate:deploy"]
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_SITE_URL: http://localhost:3000
      PUBLIC_SITE_NAME: 퐁냐
      ORIGIN: http://localhost:3000
      DATABASE_URL: mysql://ppong_nya:${MARIADB_PASSWORD:-local-development-password}@db:3306/ppong_nya?connection_limit=10&pool_timeout=10&connect_timeout=10
      TZ: Asia/Seoul
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  mariadb-data:
