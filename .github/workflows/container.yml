name: Container image

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract app image metadata
        id: app_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/danhk0612/ppong-nya
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=ppong-nya
            org.opencontainers.image.description=Korean Mahjong Soul 4-player records and statistics service

      - name: Build and publish app image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.app_meta.outputs.tags }}
          labels: ${{ steps.app_meta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Extract collector image metadata
        id: collector_meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/danhk0612/ppong-nya-collector
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=ppong-nya-collector
            org.opencontainers.image.description=Native Mahjong Soul 4-player game collector for ppong-nya

      - name: Build and publish collector image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: collector/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.collector_meta.outputs.tags }}
          labels: ${{ steps.collector_meta.outputs.labels }}
          cache-from: type=gha,scope=collector
          cache-to: type=gha,mode=max,scope=collector
