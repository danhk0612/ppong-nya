name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  lockfile-install:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: ppong_nya
          MARIADB_USER: ppong_nya
          MARIADB_PASSWORD: ci-password
          MARIADB_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations to MariaDB 11.4
        env:
          DATABASE_URL: mysql://ppong_nya:ci-password@127.0.0.1:3306/ppong_nya
        run: npm run db:migrate:deploy

      - name: Check Svelte and TypeScript
        env:
          DATABASE_URL: mysql://ppong_nya:ci-password@127.0.0.1:3306/ppong_nya
          PUBLIC_SITE_URL: http://localhost:3000
        run: npm run check

      - name: Build application
        env:
          DATABASE_URL: mysql://ppong_nya:ci-password@127.0.0.1:3306/ppong_nya
          PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build

      - name: Verify the dynamic root is not shadowed
        run: test ! -f build/client/index.html

      - name: Validate Docker Compose files
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          docker compose --env-file .env.nas.example -f compose.production.yml config > /dev/null
          docker compose --env-file .env.oracle.example -f compose.production.yml -f compose.oracle.yml config > /dev/null
