name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  lockfile-install:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Check Svelte and TypeScript
        env:
          DATABASE_URL: mysql://ppong_nya:ci-password@127.0.0.1:3306/ppong_nya
          AUTH_SECRET: ci-only-auth-secret
          PUBLIC_SITE_URL: http://localhost:3000
        run: npm run check

      - name: Build application
        env:
          DATABASE_URL: mysql://ppong_nya:ci-password@127.0.0.1:3306/ppong_nya
          AUTH_SECRET: ci-only-auth-secret
          PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build

      - name: Verify the dynamic root is not shadowed
        run: test ! -f build/client/index.html

      - name: Validate Docker Compose files
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          docker compose --env-file .env.nas.example -f compose.production.yml config > /dev/null
          docker compose --env-file .env.oracle.example -f compose.production.yml -f compose.oracle.yml config > /dev/null
